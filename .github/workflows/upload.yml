name: Stickman Survival Story Auto Upload

on:
  schedule:
    - cron: '0 6 * * *'    # 11:00 KZ — one video per day
  workflow_dispatch:        # Қолмен іске қосу үшін

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Код жүктеу
        uses: actions/checkout@v4

      - name: Node орнату
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python орнату
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: FFmpeg орнату
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Node тәуелділіктерін орнату
        run: npm ci

      - name: Python тәуелділіктерін орнату
        run: pip install --quiet -r automation/requirements.txt

      - name: Құпия файлдарды дайындау
        working-directory: automation
        env:
          STICKMAN_CLIENT_SECRETS_JSON: ${{ secrets.STICKMAN_CLIENT_SECRETS_JSON }}
          STICKMAN_YOUTUBE_TOKEN_JSON: ${{ secrets.STICKMAN_YOUTUBE_TOKEN_JSON }}
        run: |
          echo "$STICKMAN_CLIENT_SECRETS_JSON" > client_secrets.json
          echo "$STICKMAN_YOUTUBE_TOKEN_JSON" > youtube_token.json

      - name: .env файлын жасау
        working-directory: automation
        run: |
          cat > .env << 'EOF'
          GEMINI_API_KEY=${{ secrets.STICKMAN_GEMINI_API_KEY }}
          EDGE_TTS_VOICE=en-US-ChristopherNeural
          TELEGRAM_NOTIFY_TOKEN=${{ secrets.STICKMAN_TELEGRAM_NOTIFY_TOKEN }}
          TELEGRAM_NOTIFY_CHAT_ID=${{ secrets.STICKMAN_TELEGRAM_NOTIFY_CHAT_ID }}
          YOUTUBE_CATEGORY_ID=1
          YOUTUBE_PRIVACY_STATUS=public
          YOUTUBE_MADE_FOR_KIDS=false
          MIN_BEATS=10
          MAX_BEATS=15
          MAX_RETRIES=3
          RETRY_DELAY=2
          EOF

      - name: Сценарий+дауыс+рендер+YouTube жүктеу
        working-directory: automation
        run: python generate_story.py
